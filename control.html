<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L · CONTROL</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap">
<style>
:root{--serif:"Cormorant Garamond",Georgia,"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","SimSun",serif;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei","Source Han Sans SC","Noto Sans SC",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#e9e7e1;color:#1a1a18;font-family:var(--sans);font-weight:300;line-height:1.75;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#f7f5f0,#dcd9d1)}.box{width:min(430px,90%);padding:48px;border:1px solid #c9c5bc;background:rgba(255,255,255,.45);backdrop-filter:blur(25px);border-radius:28px;text-align:center}.L{font:italic 88px/1 var(--serif)}.box h1{font:300 28px/1.35 var(--serif);margin:5px}.muted{color:#77736b;font-size:11px;line-height:1.8}input,textarea,select{width:100%;padding:12px 13px;margin-top:7px;background:rgba(255,255,255,.48);border:1px solid #c9c5bc;border-radius:12px;color:#222}textarea{min-height:100px}.btn{border:1px solid #aaa69e;background:#f5f2eb;border-radius:999px;padding:11px 18px;cursor:pointer;font-size:10px;letter-spacing:.08em}.hidden{display:none!important}.top{position:sticky;top:0;z-index:5;padding:18px 28px;background:rgba(233,231,225,.82);backdrop-filter:blur(18px);border-bottom:1px solid #d1cec6;display:flex;justify-content:space-between}.brand{font:italic 24px/1.2 var(--serif)}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px)}aside{padding:20px;border-right:1px solid #d1cec6}.nav{padding:13px 15px;border-radius:12px;font-size:11px;color:#77736b;cursor:pointer;margin-bottom:4px}.nav.active,.nav:hover{background:#f6f3ed;color:#1a1a18}.main{max-width:1100px;padding:45px;width:100%}.ey{font-size:9px;letter-spacing:.2em;color:#89857c}.title{font-family:var(--serif);font-size:clamp(30px,4.2vw,44px);font-weight:300;line-height:1.3;letter-spacing:0;margin:8px 0 35px}.card{background:rgba(255,255,255,.35);border:1px solid #d1cec6;border-radius:20px;padding:24px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #d5d2ca}.tag{font-size:8px;letter-spacing:.14em;color:#77736b}.upload{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.list{margin-top:20px}.item{display:grid;grid-template-columns:100px 1fr auto;gap:16px;align-items:center;padding:15px 0;border-bottom:1px solid #d2cfc7}.thumb{width:100px;height:75px;object-fit:cover;border-radius:10px}.item h3{font-family:var(--serif);font-size:clamp(19px,1.8vw,24px);font-weight:300;line-height:1.35;letter-spacing:0;margin:0 0 5px}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:800px){.layout{display:block}aside{display:flex;overflow:auto;padding:10px}.nav{white-space:nowrap}.main{padding:28px 18px}.grid{grid-template-columns:1fr}.upload{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:75px 1fr}.thumb{width:75px;height:65px}.actions{grid-column:1/-1}.title{font-size:clamp(26px,7vw,34px)}}
</style></head><body>
<div id="login" class="login"><div class="box"><div class="L">L</div><h1>L · CONTROL</h1><p class="muted">你的私人数字世界 · 内容与展示同步管理</p><input id="pw" type="password" placeholder="管理密码"><button class="btn" style="margin-top:14px;width:100%" onclick="login()">进入控制中心</button></div></div>
<div id="app" class="hidden"><header class="top"><div class="brand">L · CONTROL</div><button class="btn" onclick="logout()">退出</button></header><div class="layout"><aside>
<div class="nav active" onclick="show('dashboard',this)">概览</div><div class="nav" onclick="show('home',this)">首页</div><div class="nav" onclick="show('memory',this);load()">记忆</div><div class="nav" onclick="show('modules',this);load()">内容空间</div><div class="nav" onclick="show('world',this);load()">世界设置</div></aside>
<main class="main">
<section id="dashboard"><div class="ey">L · CONTROL / OVERVIEW</div><div class="title">你的世界，<br>从这里生长。</div><div class="grid"><div class="card"><div class="muted">公开记忆</div><div id="pub" style="font:32px Georgia">—</div></div><div class="card"><div class="muted">私人记忆</div><div id="pri" style="font:32px Georgia">—</div></div><div class="card"><div class="muted">内容空间</div><div id="cnt" style="font:32px Georgia">—</div></div></div></section>
<section id="home" class="hidden"><div class="ey">HOME</div><div class="title">首页内容</div><div class="card"><label class="muted">主标题</label><input id="ht"><label class="muted">副标题</label><input id="hs"><label class="muted">首页介绍</label><textarea id="hi"></textarea><button class="btn" style="margin-top:15px" onclick="saveHome()">保存并同步首页</button></div></section>
<section id="memory" class="hidden"><div class="ey">MEMORY</div><div class="title">记忆展厅</div><div class="card"><div class="upload"><div class="full"><label class="muted">照片</label><input id="img" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div><div><label class="muted">名称</label><input id="mt"></div><div><label class="muted">日期</label><input id="md" type="date"></div><div class="full"><label class="muted">记忆文字</label><textarea id="mc"></textarea></div><div><label class="muted">可见范围</label><select id="mv"><option value="public">公开</option><option value="private">私人</option></select></div><div style="display:flex;align-items:end"><button class="btn" onclick="upload()">保存作品</button></div></div></div><div id="ml" class="list"></div></section>
<section id="modules" class="hidden"><div class="ey">CONTENT ROOMS</div><div class="title">内容空间</div><div class="card"><p class="muted">这里新增的内容会立即进入对应前台空间。无需再次修改展示页面。</p><select id="kind"><option value="thoughts">思绪</option><option value="journey">旅途</option><option value="music">音乐</option><option value="collection">收藏</option><option value="future">未来</option></select><input id="ct" placeholder="标题"><input id="cd" placeholder="日期 / 标签"><textarea id="cb" placeholder="内容 / 描述"></textarea><button class="btn" style="margin-top:12px" onclick="addText()">发布到这个空间</button></div><div id="tl" class="list"></div></section>
<section id="world" class="hidden"><div class="ey">WORLD ENGINE</div><div class="title">世界设置</div><div class="card"><div class="row"><span>环境声音</span><button class="btn" id="sound" onclick="toggle('sound')">—</button></div><div class="row"><span>昼夜变化</span><button class="btn" id="daynight" onclick="toggle('daynight')">—</button></div><div class="row"><span>空间互动</span><button class="btn" id="motion" onclick="toggle('motion')">—</button></div><div class="row"><span>当前心境</span><select id="mood" onchange="setMood()" style="width:160px"><option value="calm">平静</option><option value="happy">明亮</option><option value="low">低语</option><option value="confused">游移</option></select></div></div></section>
</main></div></div>
<script>
let D={};
async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});if(!r.ok){alert('密码不正确');return}open()}
async function open(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await load()}
async function logout(){await fetch('/api/admin/logout',{method:'POST'});location.reload()}
function show(id,el){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));el.classList.add('active')}
async function load(){let r=await fetch('/api/admin/data');if(!r.ok)return;D=await r.json();document.getElementById('ht').value=D.title||'';document.getElementById('hs').value=D.sub||'';document.getElementById('hi').value=D.intro||'';document.getElementById('pub').textContent=(D.memories||[]).filter(x=>x.visibility==='public').length;document.getElementById('pri').textContent=(D.memories||[]).filter(x=>x.visibility==='private').length;document.getElementById('cnt').textContent=['thoughts','journey','music','collection','future'].reduce((n,k)=>n+(D[k]||[]).length,0);['sound','daynight','motion'].forEach(k=>document.getElementById(k).textContent=D.settings[k]?'开启':'关闭');document.getElementById('mood').value=D.mood||'calm';renderMemories();renderTexts()}
async function saveHome(){let r=await fetch('/api/admin/home',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:ht.value,sub:hs.value,intro:hi.value})});alert(r.ok?'首页已同步':'保存失败');await load()}
async function upload(){let f=img.files[0];if(!f)return alert('请选择照片');let fd=new FormData();fd.append('image',f);fd.append('title',mt.value);fd.append('date',md.value);fd.append('caption',mc.value);fd.append('visibility',mv.value);let r=await fetch('/api/admin/memories',{method:'POST',body:fd});if(!r.ok){let x=await r.json();return alert(x.detail||'上传失败')}img.value='';mt.value='';mc.value='';await load();alert('记忆已同步到前台')}
function renderMemories(){ml.innerHTML=(D.memories||[]).map(m=>`<div class="item"><img class="thumb" src="${m.file}"><div><h3>${esc(m.title)}</h3><div class="muted">${esc(m.date)} · ${m.visibility==='private'?'私人':'公开'}<br>${esc(m.caption||'')}</div></div><div class="actions"><button class="btn" onclick="delMem('${m.id}')">删除</button></div></div>`).join('')||'<div class="card muted">还没有记忆。</div>'}
async function delMem(id){if(!confirm('删除这件记忆？'))return;await fetch('/api/admin/memories/'+id,{method:'DELETE'});await load()}
async function addText(){let kind=document.getElementById('kind').value,r=await fetch('/api/admin/text/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:ct.value,body:cb.value,date:cd.value,tag:''})});if(!r.ok)return alert('发布失败');ct.value='';cb.value='';cd.value='';await load();alert('已同步到前台')}
function renderTexts(){let all=['thoughts','journey','music','collection','future'];tl.innerHTML=all.flatMap(k=>(D[k]||[]).map(x=>`<div class="item"><div style="width:75px;height:65px;display:grid;place-items:center;border:1px solid #d1cec6;border-radius:10px;font:italic 25px Georgia">${k[0].toUpperCase()}</div><div><h3>${esc(x.title)}</h3><div class="muted">${esc(x.date)}<br>${esc(x.body)}</div></div><div><button class="btn" onclick="delText('${k}','${x.id}')">删除</button></div></div>`)).join('')||'<div class="card muted">还没有文字内容。</div>'}
async function delText(k,id){await fetch('/api/admin/text/'+k+'/'+id,{method:'DELETE'});await load()}
async function toggle(k){D.settings[k]=!D.settings[k];await fetch('/api/admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(D.settings)});await load()}
async function setMood(){await fetch('/api/admin/mood',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mood:document.getElementById('mood').value})});await load()}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{let r=await fetch('/api/admin/me');if(r.ok&&(await r.json()).authenticated)open()})()
</script></body></html>
