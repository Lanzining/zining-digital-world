<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dce5ec">
<title>L · 梓宁的数字世界</title>
<style>
:root{
  --ink:#10161d;--soft:#eef3f6;--glass:rgba(245,249,252,.18);
  --line:rgba(255,255,255,.42);--muted:rgba(225,232,237,.68);
  --mx:50vw;--my:50vh;--tiltX:0deg;--tiltY:0deg;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow:hidden;background:#0d1218;color:#f5f8fa;
font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid rgba(255,255,255,.8);outline-offset:4px}
#world{position:fixed;inset:0;overflow:hidden;background:
radial-gradient(70vw 55vw at var(--mx) var(--my),rgba(235,246,255,.22),transparent 58%),
linear-gradient(145deg,#111820 0%,#1b252f 42%,#10171e 100%)}
#world:before,#world:after{content:"";position:absolute;inset:-18%;pointer-events:none}
#world:before{
background:
radial-gradient(38% 30% at 20% 18%,rgba(208,225,238,.20),transparent 70%),
radial-gradient(34% 26% at 78% 22%,rgba(175,190,220,.14),transparent 70%),
radial-gradient(45% 38% at 54% 78%,rgba(123,150,176,.12),transparent 72%);
filter:blur(35px);animation:drift 22s ease-in-out infinite alternate;
}
#world:after{
background:conic-gradient(from 210deg at 50% 45%,transparent 0 26%,rgba(255,255,255,.055) 34%,transparent 45% 64%,rgba(184,207,227,.06) 72%,transparent 80%);
filter:blur(55px);mix-blend-mode:screen;animation:flow 30s linear infinite;
}
@keyframes drift{to{transform:translate3vw,-2vh) scale(1.04)}} 
@keyframes flow{to{transform:rotate(10deg) scale(1.08)}}
#frost{position:absolute;inset:-12%;
background:
radial-gradient(30vw 18vw at 35% 55%,rgba(255,255,255,.09),transparent 72%),
radial-gradient(25vw 20vw at 72% 62%,rgba(177,201,223,.10),transparent 72%);
filter:blur(28px);opacity:.9;transform:translate(calc((var(--mx) - 50vw)*-.012),calc((var(--my) - 50vh)*-.012));transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#halo{position:absolute;left:50%;top:50%;width:52vw;height:52vw;max-width:760px;max-height:760px;transform:translate(-50%,-50%);
border-radius:50%;background:radial-gradient(circle,rgba(221,235,244,.055),transparent 58%);filter:blur(18px);opacity:.55}
#architecture{position:absolute;inset:0;opacity:.28;transform:translate(calc((var(--mx) - 50vw)*-.006),calc((var(--my) - 50vh)*-.004));transition:transform .8s cubic-bezier(.2,.8,.2,1)}
#architecture i{position:absolute;display:block;border:1px solid rgba(218,231,240,.16);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0));box-shadow:0 30px 90px rgba(0,0,0,.12)}
.a1{width:45vw;height:22vh;left:8vw;bottom:8vh;transform:perspective(900px) rotateY(20deg) skewY(-3deg)}
.a2{width:32vw;height:30vh;right:4vw;bottom:15vh;transform:perspective(900px) rotateY(-22deg) skewY(3deg)}
.a3{width:16vw;height:50vh;left:42vw;bottom:-8vh;transform:perspective(900px) rotateY(7deg)}
.topbar{position:absolute;z-index:20;left:0;right:0;top:0;padding:26px 30px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand{font-size:11px;letter-spacing:.28em;opacity:.78}.status{font-size:9px;letter-spacing:.24em;text-transform:uppercase;opacity:.42}
.core{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(22vw,280px);height:min(22vw,280px);min-width:180px;min-height:180px;
display:grid;place-items:center;border-radius:28px;cursor:pointer;transition:transform 1.1s cubic-bezier(.16,1,.3,1),filter .8s;outline:none}
.core:before{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.58),rgba(220,233,242,.12) 36%,transparent 69%);filter:blur(10px);opacity:.75}
.core:after{content:"";position:absolute;inset:7%;border-radius:50%;border:1px solid rgba(255,255,255,.26);box-shadow:0 0 80px rgba(220,236,246,.13),inset 0 0 50px rgba(255,255,255,.05)}
.core:hover{transform:translate(-50%,-50%) scale(1.035);filter:brightness(1.08)}
.logo{position:relative;z-index:2;font-size:clamp(58px,9vw,128px);font-weight:200;letter-spacing:-.09em;line-height:1;text-shadow:0 2px 24px rgba(255,255,255,.18)}
.core-caption{position:absolute;z-index:2;top:calc(100% + 18px);font-size:9px;letter-spacing:.34em;opacity:.48;white-space:nowrap}
.objects{position:absolute;z-index:8;inset:0;pointer-events:none;opacity:0;transition:opacity .7s ease}
.open .objects{opacity:1}
.object{position:absolute;pointer-events:auto;width:clamp(150px,13vw,210px);height:clamp(92px,9vw,140px);border:1px solid var(--line);border-radius:30px;
background:linear-gradient(145deg,rgba(255,255,255,.19),rgba(230,239,245,.055) 52%,rgba(255,255,255,.02));
backdrop-filter:blur(24px) saturate(135%);-webkit-backdrop-filter:blur(24px) saturate(135%);
box-shadow:0 24px 70px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.08);
transform:translate3d(0,0,0) rotate(var(--r));transition:transform .65s cubic-bezier(.2,.8,.2,1),background .35s,border-color .35s;overflow:hidden}
.object:before{content:"";position:absolute;width:90px;height:90px;border-radius:50%;left:var(--lx,45%);top:var(--ly,20%);transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,255,.42),transparent 66%);filter:blur(10px);opacity:.45}
.object:hover{transform:translate3d(0,-8px,0) rotate(0deg) scale(1.025);border-color:rgba(255,255,255,.7);background:linear-gradient(145deg,rgba(255,255,255,.27),rgba(230,239,245,.08))}
.obj-inner{position:absolute;inset:18px;display:flex;flex-direction:column;justify-content:space-between}
.num{font-size:9px;letter-spacing:.28em;opacity:.42}.name{font-size:15px;letter-spacing:.18em;font-weight:450}.desc{font-size:9px;letter-spacing:.12em;opacity:.45}
.o1{left:10%;top:22%;--r:-5deg}.o2{right:10%;top:20%;--r:5deg}.o3{left:18%;top:66%;--r:4deg}.o4{right:16%;top:66%;--r:-4deg}
.o5{left:50%;top:12%;transform:translateX(-50%) rotate(-2deg)}.o6{left:50%;bottom:9%;transform:translateX(-50%) rotate(2deg)}
.o7{left:5%;top:47%;--r:-3deg}.o8{right:5%;top:46%;--r:3deg}
.open .core{transform:translate(-50%,-50%) scale(.58);filter:brightness(.86);opacity:.52}
.open .logo{animation:logoEnter 1.15s cubic-bezier(.16,1,.3,1) forwards}
@keyframes logoEnter{0%{transform:scale(1);letter-spacing:-.12em;filter:brightness(1)}45%{transform:scale(1.22);letter-spacing:-.2em;filter:brightness(1.6)}100%{transform:scale(.82);letter-spacing:-.05em;filter:brightness(.72)}}
.scrim{position:absolute;z-index:5;inset:0;background:radial-gradient(circle at center,transparent 0,rgba(8,12,17,.03) 30%,rgba(8,12,17,.34) 100%);pointer-events:none}
#room{position:fixed;z-index:40;inset:0;background:rgba(10,15,20,.36);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);opacity:0;pointer-events:none;transform:scale(1.03);transition:opacity .65s,transform .8s cubic-bezier(.16,1,.3,1)}
#room.show{opacity:1;pointer-events:auto;transform:scale(1)}
.room-card{position:absolute;inset:8vh 7vw;border:1px solid rgba(255,255,255,.26);border-radius:42px;background:linear-gradient(145deg,rgba(245,250,253,.13),rgba(220,233,241,.045));box-shadow:0 40px 120px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.22);overflow:hidden}
.room-head{padding:30px 34px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.10)}
.room-title{font-size:clamp(20px,3vw,36px);font-weight:300;letter-spacing:.08em}.room-sub{font-size:9px;letter-spacing:.25em;opacity:.45;margin-top:8px}
.close{border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.08);border-radius:999px;padding:11px 16px;cursor:pointer;font-size:10px;letter-spacing:.16em}
.gallery{height:calc(100% - 104px);overflow:auto;padding:30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px}
.tile{min-height:210px;border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);position:relative}
.tile img{width:100%;height:100%;min-height:210px;object-fit:cover;display:block;opacity:.86;filter:saturate(.85)}
.tile .meta{position:absolute;left:0;right:0;bottom:0;padding:42px 16px 15px;background:linear-gradient(transparent,rgba(0,0,0,.68));font-size:11px}
.tile small{display:block;opacity:.5;margin-top:5px}
.empty{grid-column:1/-1;display:grid;place-items:center;min-height:300px;opacity:.48;letter-spacing:.14em;font-size:11px}
.hint{position:absolute;z-index:15;left:50%;bottom:7vh;transform:translateX(-50%);font-size:9px;letter-spacing:.28em;opacity:.38;white-space:nowrap;transition:opacity .4s}
.open .hint{opacity:0}
@media(max-width:760px){
  .topbar{padding:20px}.status{display:none}
  #halo{width:100vw;height:100vw;opacity:.42}
  .core{min-width:150px;min-height:150px;width:42vw;height:42vw}
  .object{width:142px;height:92px;border-radius:24px}
  .o1{left:3%;top:17%}.o2{right:3%;top:17%}.o3{left:4%;top:70%}.o4{right:4%;top:70%}
  .o5{top:8%}.o6{bottom:6%}.o7{left:0;top:45%}.o8{right:0;top:45%}
  .room-card{inset:3vh 3vw;border-radius:28px}.room-head{padding:22px}.gallery{padding:18px;grid-template-columns:repeat(2,1fr);gap:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="world">
  <div id="frost"></div><div id="halo"></div>
  <div id="architecture"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
  <div class="scrim"></div>
  <header class="topbar"><div class="brand">L · 梓宁</div><div class="status" id="status">私人数字世界</div></header>

  <main>
    <button class="core" id="core" aria-label="Enter L · ZINING">
      <span class="logo">L</span><span class="core-caption">进入我的世界</span>
    </button>
    <div class="objects" id="objects">
      <button class="object o1" data-room="记忆"><span class="obj-inner"><span class="num">01</span><span class="name">记忆</span><span class="desc">私人记忆档案</span></span></button>
      <button class="object o2" data-room="思绪"><span class="obj-inner"><span class="num">02</span><span class="name">思绪</span><span class="desc">思想碎片</span></span></button>
      <button class="object o3" data-room="心境"><span class="obj-inner"><span class="num">03</span><span class="name">心境</span><span class="desc">内在天气</span></span></button>
      <button class="object o4" data-room="旅途"><span class="obj-inner"><span class="num">04</span><span class="name">旅途</span><span class="desc">旅途与时间</span></span></button>
      <button class="object o5" data-room="音乐"><span class="obj-inner"><span class="num">05</span><span class="name">音乐</span><span class="desc">声音空间</span></span></button>
      <button class="object o6" data-room="未来"><span class="obj-inner"><span class="num">06</span><span class="name">未来</span><span class="desc">未来边界</span></span></button>
      <button class="object o7" data-room="收藏"><span class="obj-inner"><span class="num">07</span><span class="name">收藏</span><span class="desc">收藏与艺术</span></span></button>
      <button class="object o8" data-room="CONTROL"><span class="obj-inner"><span class="num">08</span><span class="name">L · 控制</span><span class="desc">世界引擎</span></span></button>
    </div>
    <div class="hint">移动光标感受空间 · 点击 L 进入</div>
  </main>
</div>

<section id="room" aria-hidden="true">
  <div class="room-card">
    <div class="room-head"><div><div class="room-title" id="roomTitle">记忆</div><div class="room-sub" id="roomSub">私人记忆档案</div></div><button class="close" id="close">关闭</button></div>
    <div class="gallery" id="gallery"></div>
  </div>
</section>

<script>
const world=document.getElementById('world'), core=document.getElementById('core'), room=document.getElementById('room');
const gallery=document.getElementById('gallery'), roomTitle=document.getElementById('roomTitle'), roomSub=document.getElementById('roomSub');
let memories=[];

function pointer(x,y){
  document.documentElement.style.setProperty('--mx',x+'px');
  document.documentElement.style.setProperty('--my',y+'px');
  const rx=((y-innerHeight/2)/innerHeight)*3, ry=((x-innerWidth/2)/innerWidth)*-3;
  document.documentElement.style.setProperty('--tiltX',rx+'deg');
  document.documentElement.style.setProperty('--tiltY',ry+'deg');
  document.querySelectorAll('.object').forEach((el,i)=>{
    const r=el.getBoundingClientRect(), dx=x-(r.left+r.width/2), dy=y-(r.top+r.height/2);
    const d=Math.hypot(dx,dy), f=Math.max(0,1-d/420);
    el.style.transform=`translate3d(${dx*f*.018}px,${dy*f*.018}px,0) rotate(var(--r))`;
    el.style.setProperty('--lx',(50-dx/8)+'%'); el.style.setProperty('--ly',(30-dy/8)+'%');
  });
}
addEventListener('pointermove',e=>pointer(e.clientX,e.clientY),{passive:true});
addEventListener('touchmove',e=>{const t=e.touches[0]; if(t) pointer(t.clientX,t.clientY)},{passive:true});

core.addEventListener('click',()=>world.classList.toggle('open'));
document.querySelectorAll('.object').forEach(el=>el.addEventListener('click',()=>openRoom(el.dataset.room)));

async function load(){
  try{
    const r=await fetch('/api/public',{cache:'no-store'}); const d=await r.json();
    memories=d.memories||[];
    if(d.title) document.getElementById('status').textContent='私人数字世界';
  }catch(e){}
}
function openRoom(name){
  if(name==='记忆'){renderMemory();roomTitle.textContent='记忆';roomSub.textContent='私人记忆档案'}
  else if(name==='CONTROL'){location.href='/control';return}
  else {gallery.innerHTML='<div class="empty">这个空间正在形成 · 世界会在这里继续生长</div>';roomTitle.textContent=name;roomSub.textContent='正在形成'}
  room.classList.add('show');room.setAttribute('aria-hidden','false');
}
function renderMemory(){
  if(!memories.length){gallery.innerHTML='<div class="empty">NO 记忆 HAS BEEN PLACED HERE YET</div>';return}
  gallery.innerHTML=memories.map(m=>`<article class="tile"><img src="${m.file}" alt=""><div class="meta">${escapeHtml(m.title||'未命名记忆')}<small>${escapeHtml(m.date||'')}</small></div></article>`).join('');
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('close').addEventListener('click',()=>room.classList.remove('show'));
room.addEventListener('click',e=>{if(e.target===room)room.classList.remove('show')});
load();
</script>
</body>
</html>
