<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L · ZINING</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;background:#030405;color:#f1f2f4;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
:root{--gold:#d8bd78;--x:50%;--y:50%}
body{min-height:100vh;background:radial-gradient(circle at var(--x) var(--y),rgba(210,220,230,.14),transparent 20%),radial-gradient(circle at 70% 30%,rgba(105,85,170,.08),transparent 30%),#030405}
#stars{position:fixed;inset:0;opacity:.55;pointer-events:none;background-image:radial-gradient(#fff .7px,transparent .8px);background-size:86px 86px}
.world{position:fixed;inset:0;pointer-events:none;overflow:hidden}.ring{position:absolute;left:50%;top:52%;width:65vw;height:65vw;max-width:900px;max-height:900px;border:1px solid rgba(255,255,255,.12);border-radius:50%;transform:translate(-50%,-50%) rotateX(65deg);animation:r 30s linear infinite}.ring2{width:45vw;height:45vw;border-color:rgba(216,189,120,.12);animation-duration:20s;animation-direction:reverse}.city{position:absolute;bottom:0;left:0;right:0;height:28vh;opacity:.55;background:linear-gradient(90deg,transparent 2%,rgba(255,255,255,.09) 2.3%,transparent 2.6%) 0/8vw 100%;clip-path:polygon(0 60%,6% 60%,6% 35%,11% 35%,11% 70%,17% 70%,17% 22%,22% 22%,22% 55%,29% 55%,29% 32%,35% 32%,35% 62%,42% 62%,42% 15%,47% 15%,47% 55%,54% 55%,54% 28%,61% 28%,61% 62%,68% 62%,68% 18%,74% 18%,74% 53%,81% 53%,81% 33%,88% 33%,88% 64%,95% 64%,95% 40%,100% 40%,100% 100%,0 100%)}
@keyframes r{to{transform:translate(-50%,-50%) rotateX(65deg) rotateZ(360deg)}}
main{min-height:100vh;display:grid;place-items:center;text-align:center;position:relative;z-index:2}.hero{transform:translateY(-5vh)}h1{font-size:clamp(28px,4.2vw,62px);font-weight:300;letter-spacing:.1em;margin:0 0 18px}.sub{font-size:11px;letter-spacing:.32em;color:#9ca4ad}.clock{margin-top:32px;font-size:9px;letter-spacing:.3em;color:#737b84}
.logo{position:fixed;z-index:5;top:27px;left:30px;font:25px Georgia;cursor:pointer}.logo small{font:9px Inter;letter-spacing:.35em;color:#8f969e;margin-left:8px}.entry{position:fixed;z-index:5;left:27px;bottom:27px;width:50px;height:50px;border:1px solid rgba(255,255,255,.18);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.035);backdrop-filter:blur(18px);cursor:pointer}.sound{position:fixed;right:28px;bottom:30px;z-index:5;font-size:9px;letter-spacing:.2em;color:#89919a;cursor:pointer}
.modal{position:fixed;inset:0;z-index:20;background:rgba(2,3,4,.76);backdrop-filter:blur(24px);display:none;padding:5vh 4vw;overflow:hidden}.modal.open{display:block;animation:f .5s}.sheet{height:100%;max-width:1180px;margin:auto;border:1px solid rgba(255,255,255,.12);border-radius:25px;background:rgba(255,255,255,.045);padding:30px;overflow:auto}.close{float:right;background:none;border:0;color:#aaa;font-size:22px;cursor:pointer}.ey{font-size:9px;letter-spacing:.3em;color:#858e97}.sheet h2{font-size:42px;font-weight:300;margin:10px 0 8px}.intro{color:#858e97;font-size:11px;letter-spacing:.08em;margin-bottom:28px;overflow-wrap:anywhere}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.memory{position:relative;min-height:280px;border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.035);cursor:pointer}.memory img{width:100%;height:100%;min-height:280px;object-fit:cover;display:block;filter:saturate(.82) contrast(1.03);transition:transform .8s,filter .8s}.memory:hover img{transform:scale(1.045);filter:saturate(1) contrast(1.06)}.memory:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.8));pointer-events:none}.meta{position:absolute;z-index:2;left:18px;right:18px;bottom:16px}.meta b{font-size:15px;font-weight:400}.meta span{display:block;color:#a5adb5;font-size:9px;letter-spacing:.16em;margin-top:7px}.empty{padding:70px 20px;text-align:center;border:1px dashed rgba(255,255,255,.12);border-radius:18px;color:#737c85;font-size:11px;grid-column:1/-1}
.viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;place-items:center;padding:5vh 5vw}.viewer.open{display:grid}.viewer img{max-width:94vw;max-height:84vh;object-fit:contain;box-shadow:0 25px 100px rgba(0,0,0,.6)}.vclose{position:fixed;right:25px;top:20px;background:none;border:0;color:#bbb;font-size:30px;cursor:pointer}.vtext{position:fixed;bottom:20px;text-align:center;left:10%;right:10%;font-size:12px;color:#9ca4ad}

.museum{width:100%;height:100%;max-width:1280px;margin:auto;position:relative;overflow-x:hidden;overflow-y:auto;padding:34px 34px 50px;border:1px solid rgba(255,255,255,.11);border-radius:28px;background:
radial-gradient(circle at 82% 8%,rgba(216,189,120,.09),transparent 25%),
radial-gradient(circle at 15% 80%,rgba(135,145,190,.07),transparent 28%),
linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));box-shadow:0 30px 100px rgba(0,0,0,.55)}
.museum:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.035) 48%,transparent 62%);transform:translateX(-80%);animation:sweep 12s ease-in-out infinite}
.museum-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;min-width:0;position:relative;z-index:1}
.museum h2{font-size:clamp(42px,6vw,78px);font-weight:200;overflow-wrap:anywhere;letter-spacing:.02em;margin:8px 0 10px}
.museum-mark{font:100px/1 Georgia;color:rgba(216,189,120,.2);margin-right:25px;user-select:none}
.museum-line{height:1px;background:linear-gradient(90deg,rgba(216,189,120,.55),rgba(255,255,255,.06),transparent);margin:26px 0 26px}
.gallery{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:105px;gap:14px;position:relative;z-index:1;min-width:0}
.memory{grid-column:span 4;grid-row:span 3;min-height:0;min-width:0;border:1px solid rgba(255,255,255,.11);border-radius:4px;background:#090a0c;cursor:pointer;overflow:hidden;box-shadow:0 12px 45px rgba(0,0,0,.3);transition:transform .65s cubic-bezier(.2,.75,.2,1),border-color .5s,box-shadow .65s}
.memory:nth-child(3n+2){grid-column:span 5;grid-row:span 4}
.memory:nth-child(5n+1){grid-column:span 7;grid-row:span 4}
.memory:nth-child(5n+4){grid-column:span 5;grid-row:span 3}
.memory:hover{transform:translateY(-8px) scale(1.008);border-color:rgba(216,189,120,.42);box-shadow:0 25px 75px rgba(0,0,0,.62),0 0 55px rgba(216,189,120,.06)}
.memory img{display:block;width:100%;max-width:100%;min-height:0;height:100%;object-fit:cover;filter:grayscale(.12) saturate(.72) brightness(.78);transition:transform 1.1s cubic-bezier(.15,.7,.15,1),filter 1s}
.memory:hover img{transform:scale(1.07);filter:grayscale(0) saturate(.94) brightness(.92)}
.memory:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.1),transparent 28%,transparent 70%,rgba(216,189,120,.06));opacity:.45}
.memory:after{background:linear-gradient(transparent 35%,rgba(0,0,0,.86))}
.meta{left:20px;right:20px;bottom:18px}.meta b{font-size:16px;letter-spacing:.04em}.meta span{font-size:9px;letter-spacing:.18em}
.empty{min-height:360px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.035),transparent);padding:50px}
.viewer{background:radial-gradient(circle at 50% 38%,rgba(90,95,105,.14),transparent 32%),rgba(0,0,0,.96);backdrop-filter:blur(20px)}
.viewer-stage{width:100%;height:100%;display:grid;place-items:center;position:relative}
.viewer img{max-width:min(88vw,1200px);max-height:76vh;object-fit:contain;box-shadow:0 40px 140px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.1)}
.viewer-index{position:absolute;left:4vw;top:4vh;color:#747c84;font-size:9px;letter-spacing:.3em}
.viewer-info{position:absolute;left:8vw;right:8vw;bottom:4vh;text-align:center;pointer-events:none;text-shadow:0 2px 20px #000}
.viewer-title{font-size:clamp(18px,2.5vw,30px);font-weight:300;letter-spacing:.08em}
.viewer-caption{font-size:11px;color:#a3abb3;margin-top:8px;letter-spacing:.08em}
.viewer-date{font-size:8px;color:#68717a;margin-top:8px;letter-spacing:.25em}
@keyframes sweep{0%,100%{transform:translateX(-80%);opacity:0}30%,70%{opacity:1}50%{transform:translateX(80%)}}
@media(max-width:800px){
 .modal{padding:3vh 2.5vw}.museum{padding:24px 18px 40px;border-radius:20px}.museum-mark{font-size:68px;margin-right:4px}.museum h2{font-size:42px}
 .gallery{grid-template-columns:1fr 1fr;grid-auto-rows:160px;gap:9px}
 .memory,.memory:nth-child(3n+2),.memory:nth-child(5n+1),.memory:nth-child(5n+4){grid-column:span 1;grid-row:span 2}
 .memory:nth-child(4n+1){grid-column:span 2;grid-row:span 3}
 .viewer img{max-width:94vw;max-height:70vh}.viewer-info{left:5vw;right:5vw}
}
@media(max-width:520px){
 .modal{padding:2vh 2vw}.museum{padding-left:14px;padding-right:14px}.museum-head{align-items:center}.museum-mark{display:none}.museum h2{font-size:38px}.intro{line-height:1.8}
 .gallery{grid-template-columns:1fr;grid-auto-rows:330px}.memory,.memory:nth-child(4n+1){grid-column:span 1;grid-row:span 1}
 .memory img{height:100%}.viewer img{max-height:66vh}
}

@keyframes f{from{opacity:0}to{opacity:1}}
@media(max-width:800px){.gallery{grid-template-columns:1fr 1fr}.sheet{padding:22px}.sheet h2{font-size:32px}}
@media(max-width:560px){.gallery{grid-template-columns:1fr}.memory,.memory img{min-height:360px}.logo{left:20px}.entry{left:20px}.sound{right:20px}}
</style>
</head>
<body>
<div id="stars"></div><div class="world"><div class="ring"></div><div class="ring ring2"></div><div class="city"></div></div>
<div class="logo" onclick="openWorld()">L<small>ZINING</small></div>
<main><div class="hero"><h1 id="title">在世界之外，留一方属于我的世界。</h1><div class="sub" id="sub">Beyond the world, I keep a world of my own.</div><div class="clock" id="clock"></div></div></main>
<div class="entry" onclick="openWorld()">L</div><div class="sound" onclick="sound()">● AMBIENT ON</div>

<div class="modal" id="worldModal">
  <div class="museum">
    <button class="close" onclick="closeWorld()">×</button>
    <div class="museum-head">
      <div>
        <div class="ey">L · ZINING / MEMORY EXHIBITION</div>
        <h2>记忆展厅</h2>
        <div class="intro">时间留下痕迹，而我把其中一些，留在这里。</div>
      </div>
      <div class="museum-mark">L</div>
    </div>
    <div class="museum-line"></div>
    <div class="gallery" id="gallery"></div>
  </div>
</div>

<div class="viewer" id="viewer">
  <button class="vclose" onclick="closeViewer()">×</button>
  <div class="viewer-stage">
    <div class="viewer-index" id="viewerIndex"></div>
    <img id="viewerImg">
    <div class="viewer-info">
      <div class="viewer-title" id="viewerTitle"></div>
      <div class="viewer-caption" id="viewerCaption"></div>
      <div class="viewer-date" id="viewerDate"></div>
    </div>
  </div>
</div>

<script>
let memories=[];
async function sync(){
 try{
  const r=await fetch('/api/public');
  if(!r.ok)return;
  const d=await r.json();
  document.getElementById('title').textContent=d.title||'';
  document.getElementById('sub').textContent=d.sub||'';
  memories=d.memories||[];
 }catch(e){}
}
function renderGallery(){
 const el=document.getElementById('gallery');
 if(!memories.length){el.innerHTML='<div class="empty">记忆展厅正在等待第一件作品。<br><br>在 L · CONTROL 中上传你的第一张照片。</div>';return;}
 el.innerHTML=memories.map((m,i)=>`
  <article class="memory" onclick="openViewer(${i})">
   <img src="${m.file}" alt="">
   <div class="meta"><b>${esc(m.title||'Untitled Memory')}</b><span>${esc(m.date||'')}${m.caption?' · '+esc(m.caption):''}</span></div>
  </article>`).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openWorld(){sync().then(()=>{renderGallery();document.getElementById('worldModal').classList.add('open')})}
function closeWorld(){document.getElementById('worldModal').classList.remove('open')}
function openViewer(i){
 const m=memories[i];
 document.getElementById('viewerImg').src=m.file;
 document.getElementById('viewerIndex').textContent=String(i+1).padStart(2,'0')+' / '+String(memories.length).padStart(2,'0');
 document.getElementById('viewerTitle').textContent=m.title||'Untitled Memory';
 document.getElementById('viewerCaption').textContent=m.caption||'';
 document.getElementById('viewerDate').textContent=m.date||'';
 document.getElementById('viewer').classList.add('open');
}
function closeViewer(){document.getElementById('viewer').classList.remove('open')}
function clock(){document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','.')}
setInterval(clock,1000);clock();sync();
document.addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--x',e.clientX+'px');document.documentElement.style.setProperty('--y',e.clientY+'px')});
let ctx;function sound(){if(!ctx){ctx=new AudioContext();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=62;g.gain.value=.012;o.connect(g).connect(ctx.destination);o.start()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeViewer();closeWorld()}});
</script>
</body>
</html>
