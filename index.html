<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L · ZINING</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#030405;color:#f1f2f4;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}:root{--gold:#d8bd78;--x:50%;--y:50%}
body{background:radial-gradient(circle at var(--x) var(--y),rgba(210,220,230,.14),transparent 20%),radial-gradient(circle at 70% 30%,rgba(105,85,170,.08),transparent 30%),#030405;transition:background 1s}
#stars{position:fixed;inset:0;opacity:.6;background-image:radial-gradient(#fff .7px,transparent .8px);background-size:86px 86px}
.world{position:fixed;inset:0;pointer-events:none}.ring{position:absolute;left:50%;top:52%;width:65vw;height:65vw;max-width:900px;max-height:900px;border:1px solid rgba(255,255,255,.12);border-radius:50%;transform:translate(-50%,-50%) rotateX(65deg);animation:r 30s linear infinite}.ring2{width:45vw;height:45vw;border-color:rgba(216,189,120,.12);animation-duration:20s;animation-direction:reverse}.city{position:absolute;bottom:0;left:0;right:0;height:28vh;opacity:.55;background:linear-gradient(90deg,transparent 2%,rgba(255,255,255,.09) 2.3%,transparent 2.6%) 0/8vw 100%;clip-path:polygon(0 60%,6% 60%,6% 35%,11% 35%,11% 70%,17% 70%,17% 22%,22% 22%,22% 55%,29% 55%,29% 32%,35% 32%,35% 62%,42% 62%,42% 15%,47% 15%,47% 55%,54% 55%,54% 28%,61% 28%,61% 62%,68% 62%,68% 18%,74% 18%,74% 53%,81% 53%,81% 33%,88% 33%,88% 64%,95% 64%,95% 40%,100% 40%,100% 100%,0 100%)}
@keyframes r{to{transform:translate(-50%,-50%) rotateX(65deg) rotateZ(360deg)}}
main{height:100%;display:grid;place-items:center;text-align:center;position:relative;z-index:2}.hero{transform:translateY(-3vh)}h1{font-size:clamp(28px,4.2vw,62px);font-weight:300;letter-spacing:.1em;margin:0 0 18px}.sub{font-size:11px;letter-spacing:.32em;color:#9ca4ad}.clock{margin-top:32px;font-size:9px;letter-spacing:.3em;color:#737b84}
.logo{position:fixed;z-index:5;top:27px;left:30px;font:25px Georgia;cursor:pointer}.logo small{font:9px Inter;letter-spacing:.35em;color:#8f969e;margin-left:8px}.entry{position:fixed;z-index:5;left:27px;bottom:27px;width:50px;height:50px;border:1px solid rgba(255,255,255,.18);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.035);backdrop-filter:blur(18px);cursor:pointer}.sound{position:fixed;right:28px;bottom:30px;z-index:5;font-size:9px;letter-spacing:.2em;color:#89919a;cursor:pointer}
.modal{position:fixed;inset:0;z-index:20;background:rgba(2,3,4,.72);backdrop-filter:blur(24px);display:none;padding:6vh 5vw}.modal.open{display:block;animation:f .5s}.sheet{height:100%;max-width:1050px;margin:auto;border:1px solid rgba(255,255,255,.12);border-radius:25px;background:rgba(255,255,255,.045);padding:30px;overflow:auto}.close{float:right;background:none;border:0;color:#aaa;font-size:22px}.ey{font-size:9px;letter-spacing:.3em;color:#858e97}.sheet h2{font-size:42px;font-weight:300;margin:10px 0 28px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:20px;border:1px solid rgba(255,255,255,.1);border-radius:17px;background:rgba(255,255,255,.04);cursor:pointer}.card h3{font-weight:400;font-size:15px}.card p{font-size:11px;color:#9aa2ab;line-height:1.9}@keyframes f{from{opacity:0}to{opacity:1}}@media(max-width:700px){.cards{grid-template-columns:1fr}.sheet{padding:22px}.logo{left:20px}.entry{left:20px}.sound{right:20px}}
</style></head><body><div id="stars"></div><div class="world"><div class="ring"></div><div class="ring ring2"></div><div class="city"></div></div>
<div class="logo" onclick="openM()">L<small>ZINING</small></div><main><div class="hero"><h1 id="title">在世界之外，留一方属于我的世界。</h1><div class="sub" id="sub">Beyond the world, I keep a world of my own.</div><div class="clock" id="clock"></div></div></main><div class="entry" onclick="openM()">L</div><div class="sound" onclick="sound()">● AMBIENT ON</div>
<div class="modal" id="m"><div class="sheet"><button class="close" onclick="closeM()">×</button><div class="ey">L · ZINING / WORLD</div><h2>进入我的世界</h2><div class="cards"><div class="card"><h3>世界</h3><p>城市、空间站、展厅与真实时间共同变化。</p></div><div class="card"><h3>记忆展厅</h3><p>照片成为被保存的作品。</p></div><div class="card"><h3>想法</h3><p>留下正在发生的片段。</p></div><div class="card"><h3>私人档案</h3><p>时间 × 情绪 × 记忆。</p></div><div class="card" onclick="location.href='/control'"><h3>L · CONTROL</h3><p>网站管理入口。安全登录后管理网站。</p></div></div></div></div>
<script>
const API='/api';let local=JSON.parse(localStorage.getItem('zining_v5')||'{"title":"在世界之外，留一方属于我的世界。","sub":"Beyond the world, I keep a world of my own."}');
async function sync(){try{let r=await fetch(API+'/public');if(r.ok){let d=await r.json();if(d.title){local=d;document.getElementById('title').textContent=d.title;document.getElementById('sub').textContent=d.sub}}}catch(e){}}
function openM(){document.getElementById('m').classList.add('open')}function closeM(){document.getElementById('m').classList.remove('open')}
function clock(){document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','.')}setInterval(clock,1000);clock();sync();
document.addEventListener('pointermove',e=>{document.documentElement.style.setProperty('--x',e.clientX+'px');document.documentElement.style.setProperty('--y',e.clientY+'px')});
let ctx;function sound(){if(!ctx){ctx=new AudioContext();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=62;g.gain.value=.012;o.connect(g).connect(ctx.destination);o.start()}}
</script></body></html>
