<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;max-width:100%;overflow-x:hidden;background:#030405;color:#f1f2f4;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
 :root{--gold:#d8bd78;--x:50vw;--y:50vh;--mx:50vw;--my:50vh;--fluid:0}
body{min-height:100vh;background:
radial-gradient(circle at var(--x) var(--y),rgba(235,244,255,.24),transparent 17%),
radial-gradient(circle at 18% 24%,rgba(155,180,210,.13),transparent 30%),
radial-gradient(circle at 78% 70%,rgba(125,105,175,.11),transparent 34%),
linear-gradient(135deg,#0b0f14 0%,#10161d 42%,#070a0e 100%);}
body:before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;background:
radial-gradient(ellipse at 30% 35%,rgba(255,255,255,.08),transparent 22%),
radial-gradient(ellipse at 70% 58%,rgba(170,200,230,.08),transparent 26%),
radial-gradient(ellipse at 48% 80%,rgba(120,100,170,.07),transparent 24%);filter:blur(42px);animation:fluidDrift 18s ease-in-out infinite alternate;opacity:.9;}
body:after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle 240px at var(--mx) var(--my),rgba(245,250,255,.12),transparent 72%),linear-gradient(115deg,transparent 35%,rgba(255,255,255,.025) 50%,transparent 65%);mix-blend-mode:screen;transition:background-position .25s ease;}
@keyframes fluidDrift{0%{transform:translate3d(-2%,-1%,0) scale(1)}50%{transform:translate3d(3%,2%,0) scale(1.06)}100%{transform:translate3d(-1%,4%,0) scale(1.02)}}
#stars{position:fixed;inset:0;z-index:1;opacity:.32;pointer-events:none;background-image:radial-gradient(#fff .7px,transparent .8px);background-size:86px 86px}
.world{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;filter:blur(.1px)}.ring{position:absolute;left:50%;top:52%;width:65vw;height:65vw;max-width:900px;max-height:900px;border:1px solid rgba(255,255,255,.12);border-radius:50%;transform:translate(-50%,-50%) rotateX(65deg);animation:r 30s linear infinite}.ring2{width:45vw;height:45vw;border-color:rgba(216,189,120,.12);animation-duration:20s;animation-direction:reverse}.city{position:absolute;bottom:0;left:0;right:0;height:28vh;opacity:.55;background:linear-gradient(90deg,transparent 2%,rgba(255,255,255,.09) 2.3%,transparent 2.6%) 0/8vw 100%;clip-path:polygon(0 60%,6% 60%,6% 35%,11% 35%,11% 70%,17% 70%,17% 22%,22% 22%,22% 55%,29% 55%,29% 32%,35% 32%,35% 62%,42% 62%,42% 15%,47% 15%,47% 55%,54% 55%,54% 28%,61% 28%,61% 62%,68% 62%,68% 18%,74% 18%,74% 53%,81% 53%,81% 33%,88% 33%,88% 64%,95% 64%,95% 40%,100% 40%,100% 100%,0 100%)}
@keyframes r{to{transform:translate(-50%,-50%) rotateX(65deg) rotateZ(360deg)}}
main{min-height:100vh;display:grid;place-items:center;text-align:center;position:relative;z-index:2}.hero{transform:translateY(-5vh)}h1{font-size:clamp(28px,4.2vw,62px);font-weight:300;letter-spacing:.1em;margin:0 0 18px}.sub{font-size:11px;letter-spacing:.32em;color:#9ca4ad}.clock{margin-top:32px;font-size:9px;letter-spacing:.3em;color:#737b84}
.logo{position:fixed;z-index:5;top:27px;left:30px;font:25px Georgia;cursor:pointer}.logo small{font:9px Inter;letter-spacing:.35em;color:#8f969e;margin-left:8px}.entry{position:fixed;z-index:5;left:27px;bottom:27px;width:50px;height:50px;border:1px solid rgba(255,255,255,.18);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.035);backdrop-filter:blur(18px);cursor:pointer}.sound{position:fixed;right:28px;bottom:30px;z-index:5;font-size:9px;letter-spacing:.2em;color:#89919a;cursor:pointer}
.modal{position:fixed;inset:0;z-index:20;background:rgba(2,3,4,.76);backdrop-filter:blur(24px);display:none;padding:5vh 4vw;overflow:hidden}.modal.open{display:block;animation:f .5s}.sheet{height:100%;max-width:1180px;margin:auto;border:1px solid rgba(255,255,255,.12);border-radius:25px;background:rgba(255,255,255,.045);padding:30px;overflow:auto}.close{float:right;background:none;border:0;color:#aaa;font-size:22px;cursor:pointer}.ey{font-size:9px;letter-spacing:.3em;color:#858e97}.sheet h2{font-size:42px;font-weight:300;margin:10px 0 8px}.intro{color:#858e97;font-size:11px;letter-spacing:.08em;margin-bottom:28px;overflow-wrap:anywhere}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.memory{position:relative;min-height:280px;border:1px solid rgba(255,255,255,.1);border-radius:18px;overflow:hidden;background:rgba(255,255,255,.035);cursor:pointer}.memory img{width:100%;height:100%;min-height:280px;object-fit:cover;display:block;filter:saturate(.82) contrast(1.03);transition:transform .8s,filter .8s}.memory:hover img{transform:scale(1.045);filter:saturate(1) contrast(1.06)}.memory:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.8));pointer-events:none}.meta{position:absolute;z-index:2;left:18px;right:18px;bottom:16px}.meta b{font-size:15px;font-weight:400}.meta span{display:block;color:#a5adb5;font-size:9px;letter-spacing:.16em;margin-top:7px}.empty{padding:70px 20px;text-align:center;border:1px dashed rgba(255,255,255,.12);border-radius:18px;color:#737c85;font-size:11px;grid-column:1/-1}
.viewer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:none;place-items:center;padding:5vh 5vw}.viewer.open{display:grid}.viewer img{max-width:94vw;max-height:84vh;object-fit:contain;box-shadow:0 25px 100px rgba(0,0,0,.6)}.vclose{position:fixed;right:25px;top:20px;background:none;border:0;color:#bbb;font-size:30px;cursor:pointer}.vtext{position:fixed;bottom:20px;text-align:center;left:10%;right:10%;font-size:12px;color:#9ca4ad}

.museum{width:100%;height:100%;max-width:1280px;margin:auto;position:relative;overflow-x:hidden;overflow-y:auto;padding:34px 34px 50px;border:1px solid rgba(255,255,255,.11);border-radius:28px;background:
radial-gradient(circle at 82% 8%,rgba(216,189,120,.09),transparent 25%),
radial-gradient(circle at 15% 80%,rgba(135,145,190,.07),transparent 28%),
linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));box-shadow:0 30px 100px rgba(0,0,0,.55)}
.museum:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.035) 48%,transparent 62%);transform:translateX(-80%);animation:sweep 12s ease-in-out infinite}
.museum-head{display:flex;justify-content:space-between;align-items:flex-end;gap:30px;min-width:0;position:relative;z-index:1}
.museum h2{font-size:clamp(42px,6vw,78px);font-weight:200;overflow-wrap:anywhere;letter-spacing:.02em;margin:8px 0 10px}
.museum-mark{font:100px/1 Georgia;color:rgba(216,189,120,.2);margin-right:25px;user-select:none}
.museum-line{height:1px;background:linear-gradient(90deg,rgba(216,189,120,.55),rgba(255,255,255,.06),transparent);margin:26px 0 26px}
.gallery{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:105px;gap:14px;position:relative;z-index:1;min-width:0}
.memory{grid-column:span 4;grid-row:span 3;min-height:0;min-width:0;border:1px solid rgba(255,255,255,.11);border-radius:4px;background:#090a0c;cursor:pointer;overflow:hidden;box-shadow:0 12px 45px rgba(0,0,0,.3);transition:transform .65s cubic-bezier(.2,.75,.2,1),border-color .5s,box-shadow .65s}
.memory:nth-child(3n+2){grid-column:span 5;grid-row:span 4}
.memory:nth-child(5n+1){grid-column:span 7;grid-row:span 4}
.memory:nth-child(5n+4){grid-column:span 5;grid-row:span 3}
.memory:hover{transform:translateY(-8px) scale(1.008);border-color:rgba(216,189,120,.42);box-shadow:0 25px 75px rgba(0,0,0,.62),0 0 55px rgba(216,189,120,.06)}
.memory img{display:block;width:100%;max-width:100%;min-height:0;height:100%;object-fit:cover;filter:grayscale(.12) saturate(.72) brightness(.78);transition:transform 1.1s cubic-bezier(.15,.7,.15,1),filter 1s}
.memory:hover img{transform:scale(1.07);filter:grayscale(0) saturate(.94) brightness(.92)}
.memory:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.1),transparent 28%,transparent 70%,rgba(216,189,120,.06));opacity:.45}
.memory:after{background:linear-gradient(transparent 35%,rgba(0,0,0,.86))}
.meta{left:20px;right:20px;bottom:18px}.meta b{font-size:16px;letter-spacing:.04em}.meta span{font-size:9px;letter-spacing:.18em}
.empty{min-height:360px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.035),transparent);padding:50px}
.viewer{background:radial-gradient(circle at 50% 38%,rgba(90,95,105,.14),transparent 32%),rgba(0,0,0,.96);backdrop-filter:blur(20px)}
.viewer-stage{width:100%;height:100%;display:grid;place-items:center;position:relative}
.viewer img{max-width:min(88vw,1200px);max-height:76vh;object-fit:contain;box-shadow:0 40px 140px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.1)}
.viewer-index{position:absolute;left:4vw;top:4vh;color:#747c84;font-size:9px;letter-spacing:.3em}
.viewer-info{position:absolute;left:8vw;right:8vw;bottom:4vh;text-align:center;pointer-events:none;text-shadow:0 2px 20px #000}
.viewer-title{font-size:clamp(18px,2.5vw,30px);font-weight:300;letter-spacing:.08em}
.viewer-caption{font-size:11px;color:#a3abb3;margin-top:8px;letter-spacing:.08em}
.viewer-date{font-size:8px;color:#68717a;margin-top:8px;letter-spacing:.25em}
@keyframes sweep{0%,100%{transform:translateX(-80%);opacity:0}30%,70%{opacity:1}50%{transform:translateX(80%)}}
@media(max-width:800px){
 .modal{padding:3vh 2.5vw}.museum{padding:24px 18px 40px;border-radius:20px}.museum-mark{font-size:68px;margin-right:4px}.museum h2{font-size:42px}
 .gallery{grid-template-columns:1fr 1fr;grid-auto-rows:160px;gap:9px}
 .memory,.memory:nth-child(3n+2),.memory:nth-child(5n+1),.memory:nth-child(5n+4){grid-column:span 1;grid-row:span 2}

}
@media(max-width:520px){
 .modal{padding:2vh 2vw}.museum{padding-left:14px;padding-right:14px}.museum-head{align-items:center}.museum-mark{display:none}.museum h2{font-size:38px}.intro{line-height:1.8}
 .gallery{grid-template-columns:1fr;grid-auto-rows:330px}.memory,.memory:nth-child(4n+1){grid-column:span 1;grid-row:span 1}

}


/* V13 LIQUID FROST ATMOSPHERE */
.frost-flow{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;opacity:.8}
.frost-flow:before,.frost-flow:after{content:"";position:absolute;border-radius:50%;filter:blur(70px);mix-blend-mode:screen}
.frost-flow:before{width:48vw;height:34vw;left:-8vw;top:18vh;background:radial-gradient(ellipse,rgba(185,210,235,.13),transparent 68%);animation:frostA 22s ease-in-out infinite alternate}
.frost-flow:after{width:44vw;height:38vw;right:-8vw;bottom:8vh;background:radial-gradient(ellipse,rgba(150,125,205,.11),transparent 68%);animation:frostB 26s ease-in-out infinite alternate}
@keyframes frostA{to{transform:translate(15vw,7vh) scale(1.15) rotate(8deg)}}
@keyframes frostB{to{transform:translate(-12vw,-9vh) scale(1.12) rotate(-7deg)}}

/* V11 L CORE / LIQUID GLASS NAVIGATION */
.nav-orbit{position:fixed;inset:0;z-index:35;background:radial-gradient(circle at 50% 48%,rgba(205,225,255,.075),transparent 24%),radial-gradient(circle at 18% 20%,rgba(255,255,255,.035),transparent 30%),rgba(2,3,5,.68);backdrop-filter:blur(34px) saturate(125%);display:none;align-items:center;justify-content:center;overflow:hidden;isolation:isolate}
.nav-orbit.open{display:flex;animation:coreIn .7s cubic-bezier(.16,1,.3,1)}
.nav-orbit:before,.nav-orbit:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.nav-orbit:before{width:min(78vw,900px);height:min(78vw,900px);border:1px solid rgba(255,255,255,.075);box-shadow:0 0 100px rgba(150,190,255,.035),inset 0 0 100px rgba(255,255,255,.025);animation:orbitSpin 42s linear infinite}
.nav-orbit:after{width:42vw;height:42vw;max-width:520px;max-height:520px;border:1px solid rgba(210,225,245,.045);box-shadow:0 0 80px rgba(210,225,245,.025);animation:orbitSpin 28s linear infinite reverse}
.nav-core{position:relative;z-index:2;width:min(94vw,1120px);padding:30px 28px 34px}
.nav-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:30px}.nav-ey{font-size:8px;letter-spacing:.34em;color:#8e98a3}.nav-title{font-size:clamp(32px,5vw,60px);font-weight:220;letter-spacing:.035em;margin-top:8px}.nav-note{font-size:10px;color:#7d8792;letter-spacing:.08em;margin-top:10px}.nav-close{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.045);backdrop-filter:blur(18px);color:#c6cdd5;font-size:22px;cursor:pointer;transition:.35s}.nav-close:hover{background:rgba(255,255,255,.1);transform:rotate(90deg)}
.nav-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;position:relative}
.nav-item{--mx:50%;--my:50%;position:relative;min-height:142px;padding:22px 20px;border:1px solid rgba(255,255,255,.11);border-radius:30px;background:radial-gradient(circle at var(--mx) var(--my),rgba(255,255,255,.13),transparent 32%),linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.025));box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 20px 60px rgba(0,0,0,.24),0 0 0 1px rgba(255,255,255,.015);backdrop-filter:blur(24px) saturate(135%);color:#edf0f4;text-align:left;cursor:pointer;overflow:hidden;transition:transform .65s cubic-bezier(.16,1,.3,1),border-color .45s,box-shadow .65s,background .45s}
.nav-item:before{content:"";position:absolute;inset:-30%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.16) 49%,transparent 62%);transform:translateX(-80%) rotate(8deg);transition:transform 1.1s cubic-bezier(.16,1,.3,1);pointer-events:none}
.nav-item:after{content:"";position:absolute;inset:1px;border-radius:29px;border:1px solid rgba(255,255,255,.035);pointer-events:none}
.nav-item:hover{transform:translateY(-8px) scale(1.018);border-color:rgba(220,235,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 30px 90px rgba(0,0,0,.42),0 0 50px rgba(180,210,255,.055)}.nav-item:hover:before{transform:translateX(80%) rotate(8deg)}
.nav-item:nth-child(1){grid-column:span 5;min-height:176px;border-radius:38px}.nav-item:nth-child(2){grid-column:span 4}.nav-item:nth-child(3){grid-column:span 3}.nav-item:nth-child(4){grid-column:span 3}.nav-item:nth-child(5){grid-column:span 4}.nav-item:nth-child(6){grid-column:span 5}.nav-item:nth-child(7){grid-column:span 4}.nav-item:nth-child(8){grid-column:span 3}
.nav-item.featured{background:radial-gradient(circle at var(--mx) var(--my),rgba(220,235,255,.16),transparent 35%),linear-gradient(145deg,rgba(255,255,255,.13),rgba(170,190,220,.035));border-color:rgba(220,235,255,.18)}
.nav-num{position:relative;z-index:2;font-size:8px;letter-spacing:.25em;color:#78838e}.nav-name{position:relative;z-index:2;font-size:18px;font-weight:300;letter-spacing:.09em;margin-top:30px}.nav-cn{position:relative;z-index:2;font-size:9px;color:#87919c;margin-top:7px;letter-spacing:.1em}.nav-item.featured .nav-name{font-size:23px}.nav-item.control{border-color:rgba(255,255,255,.16)}
.room-message{position:fixed;inset:0;z-index:45;background:radial-gradient(circle at 50% 45%,rgba(210,225,245,.06),transparent 25%),rgba(2,3,5,.84);backdrop-filter:blur(30px);display:none;place-items:center;text-align:center;padding:30px}.room-message.open{display:grid;animation:coreIn .5s}.room-card{width:min(620px,92vw);padding:56px 34px;border:1px solid rgba(255,255,255,.12);border-radius:38px;background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.025));backdrop-filter:blur(28px);box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 40px 120px rgba(0,0,0,.6)}.room-card .big{font:80px Georgia;color:rgba(220,230,245,.18)}.room-card h3{font-size:30px;font-weight:200;margin:10px 0}.room-card p{font-size:11px;color:#7f8891;line-height:2;letter-spacing:.08em}.room-back{margin-top:22px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.045);color:#c6cbd0;padding:11px 24px;cursor:pointer;letter-spacing:.16em;font-size:9px;backdrop-filter:blur(16px)}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
@keyframes coreIn{from{opacity:0;transform:scale(.985);filter:blur(8px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
@media(max-width:900px){.nav-core{padding:22px 18px}.nav-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.nav-item,.nav-item:nth-child(n){grid-column:span 3;min-height:120px}.nav-item:nth-child(1){grid-column:span 6;min-height:150px}.nav-item:nth-child(8){grid-column:span 6}.nav-item{border-radius:25px}.nav-item:after{border-radius:24px}}
@media(max-width:560px){.nav-core{padding:16px 10px}.nav-top{margin-bottom:20px}.nav-title{font-size:32px}.nav-note{font-size:9px}.nav-grid{grid-template-columns:1fr 1fr;gap:8px}.nav-item,.nav-item:nth-child(n){grid-column:span 1;min-height:106px;padding:17px 14px;border-radius:23px}.nav-item:nth-child(1),.nav-item:nth-child(8){grid-column:span 2;min-height:122px}.nav-item:after{border-radius:22px}.nav-name,.nav-item.featured .nav-name{font-size:14px;margin-top:22px}.nav-cn{font-size:8px}.nav-close{width:38px;height:38px}}

@keyframes f{from{opacity:0}to{opacity:1}}
@media(max-width:800px){.gallery{grid-template-columns:1fr 1fr}.sheet{padding:22px}.sheet h2{font-size:32px}}
@media(max-width:560px){.gallery{grid-template-columns:1fr}.memory,.memory img{min-height:360px}.logo{left:20px}.entry{left:20px}.sound{right:20px}}
body{transition:background 1.5s ease,filter 1.5s ease}body[data-time="day"]{filter:brightness(1.06)}body[data-time="dawn"]{filter:brightness(.98) sepia(.04)}body[data-time="dusk"]{filter:brightness(.86) saturate(.92)}body[data-time="night"]{filter:brightness(.78)}.no-motion *, .no-motion *:before, .no-motion *:after{animation-play-state:paused!important;transition:none!important}.no-motion .nav-item:hover{transform:none!important}</style>

  </div>
</div>
<div class="room-message" id="roomMessage"><div class="room-card"><div class="big">L</div><div class="nav-ey" id="roomEy"></div><h3 id="roomTitle"></h3><p>这个房间已经存在于世界的结构里。<br>内容正在等待你亲手留下第一件作品。</p><button class="room-back" onclick="closeRoom()">RETURN TO WORLD</button></div></div>

<div class="modal" id="worldModal">
  <div class="museum">
    <button class="close" onclick="closeWorld()">×</button>
    <div class="museum-head">
      <div>
        <div class="ey">L · ZINING / MEMORY EXHIBITION</div>
        <h2>记忆展厅</h2>
        <div class="intro">时间留下痕迹，而我把其中一些，留在这里。</div>
      </div>
      <div class="museum-mark">L</div>
    </div>
    <div class="museum-line"></div>
    <div class="gallery" id="gallery"></div>
  </div>
</div>

<div class="viewer" id="viewer">
  <button class="vclose" onclick="closeViewer()">×</button>
  <div class="viewer-stage">
    <div class="viewer-index" id="viewerIndex"></div>
    <img id="viewerImg">
    <div class="viewer-info">
      <div class="viewer-title" id="viewerTitle"></div>
      <div class="viewer-caption" id="viewerCaption"></div>
      <div class="viewer-date" id="viewerDate"></div>
    </div>
  </div>
</div>

<script>
let memories=[];
async function sync(){
 try{
  const r=await fetch('/api/public');
  if(!r.ok)return;
  const d=await r.json();
  document.getElementById('title').textContent=d.title||'';
  document.getElementById('sub').textContent=d.sub||'';
  memories=d.memories||[];
 }catch(e){}
}
function renderGallery(){
 const el=document.getElementById('gallery');
 if(!memories.length){el.innerHTML='<div class="empty">记忆展厅正在等待第一件作品。<br><br>在 L · CONTROL 中上传你的第一张照片。</div>';return;}
 el.innerHTML=memories.map((m,i)=>`
  <article class="memory" onclick="openViewer(${i})">
   <img src="${m.file}" alt="">
   <div class="meta"><b>${esc(m.title||'Untitled Memory')}</b><span>${esc(m.date||'')}${m.caption?' · '+esc(m.caption):''}</span></div>
  </article>`).join('');
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openNav(){document.getElementById('navModal').classList.add('open')}
function closeNav(){document.getElementById('navModal').classList.remove('open')}
function openMemory(){closeNav();sync().then(()=>{renderGallery();document.getElementById('worldModal').classList.add('open')})}
function openWorld(){openNav()}
function closeWorld(){document.getElementById('worldModal').classList.remove('open')}
function openRoom(code,title){closeNav();document.getElementById('roomEy').textContent='L · ZINING / '+code;document.getElementById('roomTitle').textContent=title;document.getElementById('roomMessage').classList.add('open')}
function closeRoom(){document.getElementById('roomMessage').classList.remove('open')}
function openViewer(i){
 const m=memories[i];
 document.getElementById('viewerImg').src=m.file;
 document.getElementById('viewerIndex').textContent=String(i+1).padStart(2,'0')+' / '+String(memories.length).padStart(2,'0');
 document.getElementById('viewerTitle').textContent=m.title||'Untitled Memory';
 document.getElementById('viewerCaption').textContent=m.caption||'';
 document.getElementById('viewerDate').textContent=m.date||'';
 document.getElementById('viewer').classList.add('open');
}
function closeViewer(){document.getElementById('viewer').classList.remove('open')}
function clock(){document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','.')}
let worldSettings={sound:true,daynight:true,motion:true};
function applyWorldSettings(){
 document.body.classList.toggle('no-motion',!worldSettings.motion);
 const now=new Date(), h=now.getHours()+now.getMinutes()/60;
 let phase='night';
 if(h>=6&&h<9) phase='dawn'; else if(h>=9&&h<17) phase='day'; else if(h>=17&&h<20) phase='dusk';
 if(!worldSettings.daynight) phase='night';
 document.body.dataset.time=phase;
 const soundEl=document.querySelector('.sound'); if(soundEl) soundEl.textContent=worldSettings.sound?'● AMBIENT ON':'○ AMBIENT OFF';
}
async function loadWorldSettings(){try{const r=await fetch('/api/public');if(r.ok){const d=await r.json();worldSettings={...worldSettings,...(d.settings||{})};}}catch(e){}applyWorldSettings();}
setInterval(()=>{if(worldSettings.daynight)applyWorldSettings()},30000);
setInterval(clock,1000);clock();sync();loadWorldSettings();
document.addEventListener('pointermove',e=>{if(!worldSettings.motion)return;document.documentElement.style.setProperty('--x',e.clientX+'px');document.documentElement.style.setProperty('--y',e.clientY+'px');document.documentElement.style.setProperty('--mx',e.clientX+'px');document.documentElement.style.setProperty('--my',e.clientY+'px');document.querySelectorAll('.nav-item').forEach(el=>{const r=el.getBoundingClientRect();el.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');el.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%')})});
let ctx;function sound(){if(!worldSettings.sound)return;if(!ctx){ctx=new AudioContext();let o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=62;g.gain.value=.012;o.connect(g).connect(ctx.destination);o.start();setTimeout(()=>{g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+1.8)},50)}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeViewer();closeWorld();closeNav();closeRoom()}});
</script>
</body>
</html>
